server:
  port: ${PORT:9091}
  servlet:
    session:
      timeout: 60m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Academia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123@}
    hikari:
      # Varios usuarios a la vez: suficientes conexiones para que nadie quede esperando
      # detrás de un reporte o PDF lento, y timeouts explícitos para fallar con un error
      # claro en vez de quedarse trabado indefinidamente si el pool se agota.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      validation-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 300000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Configuración JWT para la API REST
app:
  jwt:
    # Clave secreta Base64 de al menos 256 bits. En producción, sobreescribe con la variable JWT_SECRET.
    secret: ${JWT_SECRET:Y2FtYmlhLWVzdGEtY2xhdmUtc2VjcmV0YS1lbi1wcm9kdWNjaW9uLTEyMzQ1Njc4OTA=}
    # Duración del token en milisegundos (por defecto 8 horas)
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    # Orígenes del frontend permitidos que consumen la API (separados por coma)
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
